[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "us-mobility-data-pipeline"
version = "0.1.0"
description = "High-Performance Columnar Mobility Data Pipeline for 100M+ GPS/Probe Records with DuckDB, Parquet, Polars, and FHWA MAP-21 Metrics"
readme = "README.md"
authors = [{ name = "Dong-Yeon Chang", email = "dy.chang@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "h3>=3.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.35.0",
    "pydeck>=0.8.0",
    "plotly>=5.20.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0"
]
